 <!-- html이란 항상 사용하고 있는 것  -->
 <!-- 웹사이트의 뼈대 - 페이지 소스 보기로 확인 가능 -->
 <!-- 스타일 적용 - css -->
 <!-- 실시간 움직이는 요소들(동적 요소들) - java script -->
 <!-- F12 키 (DevTools) > 화살표 > 페이지 내 특정 요소의 위치를 구성한 html 확인 -->

 <!-- html 기본 구조 (!+Enter) -->
 <!DOCTYPE html> <!-- html5 문서임을 선언 -->
 <html lang="en">
 <head> <!-- 속성, 옵션을 지정. html 페이지의 언어, 해상도 자동 검출 후 넓이 자동 맞춤(viewport, content, initial-sclae)-->
    <!-- 웹 문서에 필요한 외부 파일(CSS)와 옵션을 설정하는 공간 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- css 링크 -->
    <!-- javascript -->
    <title>01_html_tags</title>
 </head>
 <body> 
    <!-- 웹 브라우저에 내용을 넣는 공간 -->
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>4</td>
        </tr>
    </table>
 </body>
 </html>

 <!-- 태그 -->
  <!-- 태그(tag) 웹브라우저가 웹 문서를 잘 이해할 수 있도록 콘텐츠를 목적에 맞게 분류한 규칙 -->
   <!-- 태그는 여는 태그, 닫는 태그 -->

<!-- html 4 ver. 이나 xhtml, epub -> 태그 생략 불가 --> 
<!-- html 5 -> 태그 생략 가능--> 
<!-- br, hr과 같은 태그는 닫는 태그가 없음 -->
<p> 여는 태그와 닫는 태그 사이에 내용을 입력합니다. </p>

<!-- 부모 태그와 자식 태그, 조상 태그 -->
 <!-- tr:행을 만드는 태그, td:행 안에 열을 만드는 태그 -->
<table>
    <tr>
        <td>1</td>
        <td>2</td>
    </tr>
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>
