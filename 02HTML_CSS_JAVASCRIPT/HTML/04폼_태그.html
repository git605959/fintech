<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04폼_태그</title>
  </head>
  <body>
    <!-- 폼 태그 : 사용자로부터 입력받아 서버로 전달해주는 역할 -->

    <!-- input 사용자로부터 입력을 받는 태그 -->
    <!-- label "설명" -->
    <!-- input 태그의 옵션 중 type의 값을 바꾸는 것으로 다양한 입력 양식 변경 가능 -->

    <label> 아이디 </label>
    <input type="text" />

    <hr />
    <label>패스워드</label>
    <input type="password" />
    <!-- 입력하는 내용이 *으로 변환되어 표시-->

    <hr />

    <label>체크박스</label>
    <h4>취미</h4>
    <label>스포츠</label>
    <input type="checkbox" value="sports" />
    <!-- 실제 전송되는 값은 value 값-->

    <label>게임</label>
    <input type="checkbox" value="game" />

    <label>요리</label>
    <input type="checkbox" value="cooking" />

    <hr />
    <!-- 라디오버튼의 중복을 피하기 위해서는 name 입력 필수.(같은 카테고리 묶는 것) -->
    <h4>직업</h4>
    <label>UI/UX디자이너 </label>
    <input type="radio" name="job" value="design" />
    <!--라디오 버튼은 한 개만 선택 가능-->
    <label>프론트엔드 개발자 </label>
    <input type="radio" name="job" value="design" />
    <label>백엔드 개발자 </label>
    <input type="radio" name="job" value="design" />

    <hr />
    <h3>파일 첨부</h3>
    <label>첨부파일</label>
    <input type="file" />

    <hr />
    <h3>색상값 선택하기 (컬러박스)</h3>
    <label>색상 선택</label>
    <input type="color" />

    <hr />
    <h3>날짜 선택하기</h3>
    <label>날짜 선택</label>
    <input type="date" />

    <hr />
    <h3>전송버튼</h3>
    <label>전송 버튼</label>
    <input type="submit" />

    <h3>취소버튼</h3>
    <label>전송 버튼</label>
    <input type="reset" />

    <hr />
    <h3>select 버튼(드롭다운 메뉴)</h3>
    <select>
      <option>HTML</option>
      <option>css</option>
      <option>java script</option>
    </select>

    <hr />
    <h3>텍스트 박스</h3>
    <textarea></textarea>

<hr>
<!-- form 태그 양식 -->
<!-- <form action = "전송위치 URL", method = "전송방법 GET, POST">
        # get의 경우 url 주소에 검색(입력)한 내용을 포함하여 서버에 전송 (url 주소로 웹페이지 조작이 가능하기 때문에 해킹도 가능. 로그인 창은 get 방식 절대 금지)
        https://search.shopping.naver.com/book/search?bookTabType=ALL&pageIndex=1&pageSize=40&prevQuery=%EB%84%A4%EC%9D%B4%EB%B2%84%20%EB%8F%84%EC%84%9C&query=%ED%8C%8C%EC%9D%B4%EC%8D%AC&sort=REL
        # post의 경우 url 주소로 정보 확인 불가능
        <input> 
        <input> 
        <submit>
        </form> -->
<h3>form 태그로 폼 요소 보내기</h3>
<form action="/"method="post">
    <label>아이디</label>
    <input type="text">
    <label>패스워드</label>
    <input type="password">

    <input type="reset">
    <input type="submit">
    <!-- 백엔드가 없으므로(전송받을 곳이 없음) 페이지 작동 X 표시 뜸 -->
</form>


  </body>
</html>
